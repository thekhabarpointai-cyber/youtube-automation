```yaml
name: News Video Generator

on:
  workflow_dispatch:

jobs:
  generate-video:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Generate news video
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python main.py

      - name: Check generated video
        if: always()
        run: |
          echo "================================"
          echo "GENERATED VIDEO"
          echo "================================"

          if [ -d "generated_video" ]; then
            ls -lah generated_video/
          else
            echo "generated_video folder does not exist"
          fi

          echo ""
          echo "MP4 files:"
          find . -type f -name "*.mp4" -print

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-video
          path: generated_video/
          if-no-files-found: warn
```
