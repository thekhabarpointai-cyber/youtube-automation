name: News Video Generator

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"

jobs:

  generate-video:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      - name: Check tools
        run: |
          python --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1


      - name: Generate news video
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

        run: |
          python main.py


      - name: Show generated files
        if: always()

        run: |
          echo "======================================"
          echo "GENERATED VIDEO FOLDER"
          echo "======================================"

          if [ -d generated_video ]; then
            ls -lah generated_video
          else
            echo "generated_video folder not found"
            exit 1
          fi

          echo ""
          echo "MP4 FILES:"

          find generated_video \
            -type f \
            -name "*.mp4" \
            -ls


      - name: Upload generated video
        if: success()

        uses: actions/upload-artifact@v4

        with:
          name: generated-news-video
          path: generated_video/
          if-no-files-found: error
          retention-days: 7
