```yaml
name: News Video Generator

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"

jobs:
  generate-video:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check environment
        run: |
          echo "Python:"
          python --version

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "Repository:"
          ls -lah

      - name: Generate news video
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python main.py

      - name: Check generated files
        if: always()
        run: |
          echo "======================================"
          echo "GENERATED VIDEO FOLDER"
          echo "======================================"

          if [ -d "generated_video" ]; then
            echo "generated_video folder found."
            ls -lah generated_video/
          else
            echo "ERROR: generated_video folder not found."
          fi

          echo ""
          echo "======================================"
          echo "SEARCHING FOR MP4"
          echo "======================================"

          find . -type f -name "*.mp4" -print

      - name: Upload generated video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-video
          path: generated_video/
          if-no-files-found: warn

      - name: Final status
        if: always()
        run: |
          echo "======================================"
          echo "FINAL STATUS"
          echo "======================================"

          if [ -f "generated_video/news_video.mp4" ]; then
            echo "SUCCESS: news_video.mp4 found."
            ls -lh generated_video/news_video.mp4
          else
            echo "WARNING: news_video.mp4 was not found."
          fi
```
